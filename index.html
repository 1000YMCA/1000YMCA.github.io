<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Doubles League</title>
<style>
:root{--bg:#f6f5ef;--card:#fff;--tx:#1d2a1f;--mu:#6b766c;--ac:#2f7d3a;--ac2:#d8ecd9;--bd:#dde1d6;--wa:#b4531a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a15;--card:#1d261f;--tx:#e8eee8;--mu:#93a095;--ac:#6fc27b;--ac2:#27402b;--bd:#2f3b31;--wa:#e8985c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141a15;--card:#1d261f;--tx:#e8eee8;--mu:#93a095;--ac:#6fc27b;--ac2:#27402b;--bd:#2f3b31;--wa:#e8985c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 14px 60px}
h1{font-size:20px;margin:6px 0 10px}h2{font-size:15px;margin:0 0 8px}
nav{display:flex;gap:6px;margin-bottom:12px}
nav button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.mu{color:var(--mu);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{padding:6px 11px;border-radius:99px;border:1px solid var(--bd);background:transparent;color:var(--mu);font:inherit;font-size:14px}
.chip.on{background:var(--ac2);color:var(--tx);border-color:var(--ac);font-weight:600}
.grp{border-top:1px dashed var(--bd);padding-top:10px;margin-top:10px}
.set{display:grid;grid-template-columns:1fr 46px 46px;gap:6px;align-items:center;margin:6px 0;font-size:14px}
.set input{width:100%;padding:7px 4px;text-align:center;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:9px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:600}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--bd)}
th:nth-child(2),td:nth-child(2){text-align:left}th{color:var(--mu);font-weight:600;font-size:12px}
.wrap{overflow-x:auto}.sb{color:var(--wa);font-weight:600}
input.t{padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;width:100%;margin-bottom:8px}
</style></head><body><main>
<h1>🎾 Doubles League</h1>
<nav id="nav"></nav><div id="v"></div>
<div id="msg" class="mu"></div>
</main>
<script>
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const PAIRS=[[[0,3],[1,2]],[[0,2],[1,3]],[[0,1],[2,3]]];
let db=null,P={},A={},M=[],cfg={days:[1,3,5]},tab="sched",ready=false,drafts={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const nm=id=>P[id]?P[id].name:"?";
function sessions(){const out=[],t=new Date();t.setHours(12,0,0,0);
 for(let i=-7;i<=21;i++){const d=new Date(t);d.setDate(t.getDate()+i);if(cfg.days.includes(d.getDay()))out.push({date:iso(d),label:DAYS[d.getDay()]+" "+(d.getMonth()+1)+"/"+d.getDate(),past:i<0});}
 return out;}
function stats(){const s={};Object.keys(P).forEach(id=>s[id]={id,W:0,L:0,gw:0,gl:0,m:0});
 M.forEach(m=>{(m.players||[]).forEach(p=>s[p]&&s[p].m++);
  (m.sets||[]).forEach((st,i)=>{const[a,b]=st;if(a==null||b==null||a===b)return;
   PAIRS[i].forEach((team,ti)=>team.forEach(k=>{const r=s[m.players[k]];if(!r)return;
    const my=ti?b:a,op=ti?a:b;r.gw+=my;r.gl+=op;my>op?r.W++:r.L++;}));});});
 const all=Object.values(s).map(r=>({...r,score:(r.W+1)/(r.W+r.L+2),diff:r.gw-r.gl,avg:(r.W+r.L)?(r.gw-r.gl)/(r.W+r.L):0}))
  .sort((x,y)=>((y.W+y.L)>=6)-((x.W+x.L)>=6)||y.avg-x.avg||y.diff-x.diff||y.W-x.W||y.gw-x.gw||nm(x.id).localeCompare(nm(y.id)));
 const K=all.filter(r=>r.W+r.L>=6),str={};all.forEach(r=>{const i=K.indexOf(r);str[r.id]=i<0||K.length<2?0.5:1-i/(K.length-1);});
 const ws={};M.forEach(m=>(m.sets||[]).forEach((st,i)=>{const[a,b]=st;if(a==null||b==null||a===b)return;PAIRS[i].forEach((team,ti)=>{const opp=PAIRS[i][1-ti],sv=opp.reduce((t,k)=>t+(str[m.players[k]]??0.5),0)/2,d=ti?b-a:a-b,w=d>0?d*(0.5+sv):d*(1.5-sv);team.forEach(k=>{const id=m.players[k];ws[id]=(ws[id]||0)+w;});});}));
 all.forEach(r=>{const n=r.W+r.L;r.rating=n?(ws[r.id]||0)/n:0;});
 return all.sort((x,y)=>((y.W+y.L)>=6)-((x.W+x.L)>=6)||y.rating-x.rating||y.diff-x.diff||y.W-x.W||nm(x.id).localeCompare(nm(y.id)));}
function seed(r){const k=r.filter(x=>x.W+x.L>=6),n=r.filter(x=>x.W+x.L<6),h=Math.floor(k.length/2);return[...k.slice(0,h),...n,...k.slice(h)];}
function plan(date,rank){
 const rec=M.filter(m=>m.date===date),used=new Set(rec.flatMap(m=>m.players));
 const avs=rank.filter(r=>A[date+"_"+r.id]&&!used.has(r.id)),k=avs.length%4,byTime=[...avs].sort((a,b)=>A[date+"_"+b.id]-A[date+"_"+a.id]),sbs=byTime.slice(0,k),sbSet=new Set(sbs.map(r=>r.id));
 const av=seed(avs.filter(r=>!sbSet.has(r.id))).map(r=>r.id);
 const groups=[];for(let i=0;i+4<=av.length;i+=4)groups.push(av.slice(i,i+4));
 return{rec,groups,standby:sbs.map(r=>r.id).reverse()};}
function setHtml(date,key,pl,vals){return PAIRS.map((pr,i)=>{const v=(vals&&vals[i])||[];
 return `<div class="set"><div>Set ${i+1}: ${esc(nm(pl[pr[0][0]]))} &amp; ${esc(nm(pl[pr[0][1]]))}<br><span class="mu">vs ${esc(nm(pl[pr[1][0]]))} &amp; ${esc(nm(pl[pr[1][1]]))}</span></div>
 <input inputmode="numeric" data-k="${key}" data-i="${i}" data-t="0" value="${v[0]??""}"><input inputmode="numeric" data-k="${key}" data-i="${i}" data-t="1" value="${v[1]??""}"></div>`}).join("");}
function render(){
 $("#nav").innerHTML=[["sched","Schedule"],["rank","Rankings"],["ppl","Players"]].map(([k,l])=>`<button class="${tab===k?"on":""}" data-tab="${k}">${l}</button>`).join("");
 const rank=stats(),v=$("#v");
 if(!ready){v.innerHTML='<div class="card mu">Loading…</div>';return;}
 if(tab==="rank"){
  v.innerHTML=`<div class="card wrap"><h2>Rankings</h2>${rank.length?`<table><tr><th>#</th><th>Player</th><th>Sets W–L</th><th>Games W–L</th><th>Total +/−</th><th>Rating</th></tr>`+
  rank.map((r,i)=>`<tr><td>${(r.W+r.L)>=6?i+1:"–"}</td><td>${esc(nm(r.id))}${(r.W+r.L)<6?` <span class="mu">(${r.W+r.L}/6 sets)</span>`:""}</td><td>${r.W}–${r.L}</td><td>${r.gw}–${r.gl}</td><td>${r.diff>0?"+":""}${r.diff}</td><td><b>${r.rating>0?"+":""}${r.rating.toFixed(2)}</b></td></tr>`).join("")+`</table>`:'<p class="mu">Add players first.</p>'}
  <p class="mu">Rating = weighted average games +/− per set. A games margin against higher-ranked opponents counts more when you win and less when you lose; against lower-ranked opponents it’s the reverse (weights run from 0.5× to 1.5×, based on the two opponents’ average rank). A player needs 6 sets to be ranked; until then they are listed below the ranked players, but are slotted into the middle when groups are formed. Ties are broken by total +/−, then sets won.</p></div>`;return;}
 if(tab==="ppl"){
  v.innerHTML=`<div class="card"><h2>Add a player</h2><input class="t" id="pn" placeholder="Name"><button class="btn" id="addp">Add player</button></div>
  <div class="card"><h2>League days</h2><div class="chips">${DAYS.map((d,i)=>`<button class="chip ${cfg.days.includes(i)?"on":""}" data-day="${i}">${d}</button>`).join("")}</div></div>
  <div class="card"><h2>Players (${rank.length})</h2>${rank.map(r=>`<div style="display:flex;justify-content:space-between;padding:5px 0"><span>${esc(nm(r.id))}</span><button class="chip" data-del="${r.id}">Remove</button></div>`).join("")||'<p class="mu">No players yet.</p>'}</div>`;return;}
 v.innerHTML=sessions().map(s=>{const pl=plan(s.date,rank);
  const chips=rank.map(r=>`<button class="chip ${A[s.date+"_"+r.id]?"on":""}" data-av="${s.date}|${r.id}">${esc(nm(r.id))}</button>`).join("");
  const rec=pl.rec.map(m=>`<div class="grp"><b>Played</b> · ${m.players.map(p=>esc(nm(p))).join(", ")}${setHtml(s.date,m.id,m.players,m.sets)}<button class="btn sec" data-save="${m.id}" data-date="${s.date}">Update scores</button></div>`).join("");
  const gs=pl.groups.map((g,i)=>`<div class="grp"><b>Group ${pl.rec.length+i+1}</b> · <span class="mu">${g.map(p=>esc(nm(p))).join(", ")}</span>${setHtml(s.date,s.date+"_"+g[0],g,drafts[s.date+"_"+g[0]])}<button class="btn" data-save="${s.date}_${g[0]}" data-date="${s.date}" data-pl="${g.join(",")}">Save scores</button></div>`).join("");
  return `<div class="card"><h2>${s.label}${s.past?' <span class="mu">(past)</span>':""}</h2><div class="mu">Tap your name to toggle availability · <button class="chip" data-copy="${s.date}|${s.label}">Copy lineup</button></div><div class="chips">${chips||'<span class="mu">Add players in the Players tab.</span>'}</div>${rec}${gs}${pl.standby.length?`<div class="grp"><span class="sb">Standby</span>: ${pl.standby.map(p=>esc(nm(p))).join(", ")}<div class="mu">Last to sign up. The earliest of them moves in automatically if someone drops out.</div></div>`:""}</div>`;}).join("");}
function lineupText(d,l,pl){
 const gs=[...pl.rec.map(m=>m.players),...pl.groups],sb=pl.standby.length?pl.standby.map(nm).join(", "):"none";
 if(!gs.length)return l+" – no groups yet\nStandby: "+sb;
 const L=[l+" – Doubles",""];
 gs.forEach((g,i)=>{L.push("Group "+(i+1));PAIRS.forEach((pr,k)=>L.push("Set "+(k+1)+": "+nm(g[pr[0][0]])+" & "+nm(g[pr[0][1]])+" vs "+nm(g[pr[1][0]])+" & "+nm(g[pr[1][1]])));L.push("");});
 L.push("Standby: "+sb);return L.join("\n");}
async function copyLineup(d,l,pl){const t=lineupText(d,l,pl),m=$("#msg");
 try{await navigator.clipboard.writeText(t);m.textContent="Lineup copied. Paste it into a text or email.";}
 catch(e){m.innerHTML='<div>Select all and copy:</div><textarea id="lu" readonly rows="10" style="width:100%;margin-top:6px;padding:8px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit"></textarea>';const a=$("#lu");a.value=t;a.focus();a.select();}
 m.scrollIntoView({block:"nearest"});}
document.addEventListener("input",e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
 const d=drafts[k]=drafts[k]||[[],[],[]];d[+e.target.dataset.i][+e.target.dataset.t]=e.target.value===""?null:Math.max(0,parseInt(e.target.value)||0);});
document.addEventListener("click",async e=>{const t=e.target.closest("button");if(!t)return;const D=t.dataset;
 try{
 if(D.tab){tab=D.tab;render();return;}
 if(D.copy){const[d,l]=D.copy.split("|");await copyLineup(d,l,plan(d,stats()));return;}
 if(!db)return;
 if(D.av){const[d,id]=D.av.split("|"),key=d+"_"+id,r=db.collection("avail").doc(key);
  if(A[key])await r.delete();else await r.set({date:d,pid:id,on:true,at:Date.now()});return;}
 if(t.id==="addp"){const n=$("#pn").value.trim();if(n)await db.collection("players").add({name:n,created:Date.now()});return;}
 if(D.day!==undefined){const d=+D.day,days=cfg.days.includes(d)?cfg.days.filter(x=>x!==d):[...cfg.days,d].sort();await db.doc("config/main").set({days});return;}
 if(D.del){if(confirm("Remove "+nm(D.del)+"? Past results stay in the history."))await db.doc("players/"+D.del).delete();return;}
 if(D.save){const sets=drafts[D.save]||(M.find(m=>m.id===D.save)||{}).sets;
  if(!sets||sets.some(s=>!s||s[0]==null||s[1]==null||s[0]===s[1])){$("#msg").textContent="Enter both game scores for all 3 sets (a set can’t end tied).";return;}
  $("#msg").textContent="";
  const players=D.pl?D.pl.split(","):(M.find(m=>m.id===D.save)||{}).players;
  await db.doc("matches/"+D.save).set({date:D.date,players,sets});delete drafts[D.save];return;}
 }catch(err){$("#msg").textContent="Couldn’t save: "+(err&&err.message||err)+". You may have view-only access.";}});
render();
(async()=>{
 try{await Promise.race([claude.use("db").then(d=>{db=d}),new Promise(r=>setTimeout(r,10000))]);}catch(e){}
 if(!db){$("#v").innerHTML='<div class="card mu">The shared league data can’t be reached. Open this page while signed in to Claude.</div>';return;}
 const sub=(q,fn)=>q.onSnapshot(s=>{fn(s.docs);ready=true;
  const a=document.activeElement;if(a&&a.tagName==="INPUT"&&a.dataset.k)return;render();},()=>{});
 sub(db.collection("players"),d=>{P={};d.forEach(x=>P[x.id]=x.data());});
 sub(db.collection("avail"),d=>{A={};d.forEach(x=>A[x.id]=x.data().at||1);});
 sub(db.collection("matches"),d=>{M=d.map(x=>({id:x.id,...x.data()}));});
 sub(db.collection("config"),d=>{const c=d.find(x=>x.id==="main");if(c&&c.data().days)cfg={days:c.data().days};});
})();
</script></body></html>
